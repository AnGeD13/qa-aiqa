name: Playwright CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static:
    name: Typecheck and lint
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint tests
        run: npm run lint

  test:
    name: Playwright tests
    needs: static
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test
        env:
          CI: true

      - name: Test metrics summary
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          {
            echo '```'
            node scripts/test-metrics.mjs playwright-report/results.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Send Telegram Notifications
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TO_TOKEN }}
          format: markdown
          message: |
            *QA Pipeline Report*
            *Repository:* ${{ github.repository }}
            *Branch:* `${{ github.head_ref || github.ref_name }}`
            *Author:* ${{ github.actor }}
            *Tests:* ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }}
            [Open run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})